version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: smartpath-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-smartpath123}
    volumes:
      - mongodb_data:/data/db
      - ./backups/mongodb:/backups
    networks:
      - smartpath-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smartpath-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-smartpath123}
    volumes:
      - redis_data:/data
    networks:
      - smartpath-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Patient Service
  patient-service:
    build:
      context: ./services/patient-service
      dockerfile: Dockerfile
    container_name: smartpath-patient-service
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-smartpath123}@mongodb:27017/smartpath?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-smartpath123}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PATIENT_SERVICE_PORT: 3001
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY}
    volumes:
      - patient_uploads:/app/uploads
    networks:
      - smartpath-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Booking Service
  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile
    container_name: smartpath-booking-service
    restart: always
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-smartpath123}@mongodb:27017/smartpath?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-smartpath123}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      BOOKING_SERVICE_PORT: 3002
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    volumes:
      - booking_uploads:/app/uploads
    networks:
      - smartpath-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js)
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: smartpath-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      NEXT_PUBLIC_GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY}
      PATIENT_SERVICE_URL: http://patient-service:3001
      BOOKING_SERVICE_URL: http://booking-service:3002
      MONGODB_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-smartpath123}@mongodb:27017/smartpath?authSource=admin
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    networks:
      - smartpath-network
    depends_on:
      patient-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: smartpath-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - smartpath-network
    depends_on:
      - frontend
      - patient-service
      - booking-service

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  patient_uploads:
    driver: local
  booking_uploads:
    driver: local

networks:
  smartpath-network:
    driver: bridge
