version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: smartpath-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: smartpath123
    volumes:
      - mongodb_data:/data/db
    networks:
      - smartpath-network

  postgres:
    image: postgres:16
    container_name: smartpath-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: smartpath123
      POSTGRES_DB: smartpath
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartpath-network

  redis:
    image: redis:7-alpine
    container_name: smartpath-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass smartpath123
    volumes:
      - redis_data:/data
    networks:
      - smartpath-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: smartpath-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:smartpath-redis:6379:0:smartpath123
    networks:
      - smartpath-network
    depends_on:
      - redis

  mongo-express:
    image: mongo-express:latest
    container_name: smartpath-mongo-express
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: smartpath123
      ME_CONFIG_MONGODB_URL: mongodb://admin:smartpath123@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    networks:
      - smartpath-network
    depends_on:
      - mongodb

  nginx:
    image: nginx:alpine
    container_name: smartpath-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - smartpath-network
    depends_on:
      - mongodb
      - postgres
      - redis

volumes:
  mongodb_data:
  postgres_data:
  redis_data:

networks:
  smartpath-network:
    driver: bridge
